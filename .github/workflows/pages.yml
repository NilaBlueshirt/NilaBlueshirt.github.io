name: Build and deploy site

# Builds the site with the Buns photos pulled from the Google Photos shared
# album at build time, so the photos never enter git history. Requires
# Settings > Pages > Source = "GitHub Actions" and the BUNS_ALBUM_URL secret.
#
# Every action is pinned to a full commit SHA (tag in the trailing comment) so
# a moved tag can't change what runs here.
on:
  push:
    branches: [master]
  schedule:
    - cron: "17 * * * *" # check the album hourly; deploys only if it changed
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.album.outputs.changed }}
      deploy: ${{ github.event_name != 'schedule' || steps.album.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements-buns.txt

      # Photos already processed by earlier runs (never committed).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            images/buns
            .buns-cache
          key: buns-photos-${{ github.run_id }}
          restore-keys: buns-photos-

      - id: album
        run: python scripts/sync_buns_album.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
        env:
          BUNS_ALBUM_URL: ${{ secrets.BUNS_ALBUM_URL }}

      - if: steps.album.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            images/buns
            .buns-cache
          key: buns-photos-${{ github.run_id }}-${{ github.run_attempt }}

      - if: github.event_name != 'schedule' || steps.album.outputs.changed == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13

      - if: github.event_name != 'schedule' || steps.album.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Caches in a public repo are readable by pull-request runs from forks, so
  # delete superseded ones: a photo removed from the album shouldn't linger.
  prune-cache:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          KEEP: buns-photos-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key buns-photos- --limit 100 --json key --jq '.[].key' |
            { grep -vxF "$KEEP" || true; } |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
