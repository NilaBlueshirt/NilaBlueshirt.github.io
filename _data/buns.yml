# Buns gallery extras. The photos themselves come from the Google Photos
# shared album at build time (scripts/sync_buns_album.py) and are never
# committed: add or remove photos in the album and the site follows within
# about an hour, newest first.
#
# Optional entries here:
#
#   Alt text / caption for an album photo. The id is the photo's file name on
#   the site, e.g. /images/buns/3f9a2c1b7d4e.webp -> 3f9a2c1b7d4e
#   - id:      3f9a2c1b7d4e
#     alt:     short description for accessibility
#     caption: shown under the photo
#
#   An extra photo hosted elsewhere, shown after the album photos
#   - url:     direct link to an image (Google Drive share links are converted)
#     alt:     short description for accessibility
#     caption: optional caption
